name: Deploy site

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "wrangler.toml"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: 84461027dd878fb5bbefc45ddca584ea
          command: deploy
